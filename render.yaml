# Single Render web service: the Dockerfile builds the React app and Express serves it
# together with the /api routes, so the frontend calls the API on the same origin.
services:
  - type: web
    name: algonix
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
