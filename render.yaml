services:
  - type: web
    name: algonix
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
        sync: false
      - key: PISTON_URL
        sync: false
      # Use self-hosted Piston CE for isolated code execution.
      - key: FRONTEND_URL
        sync: false
