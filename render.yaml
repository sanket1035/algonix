services:
  - type: web
    name: algonix
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JUDGE0_URL
        value: https://judge0-ce.p.rapidapi.com
      - key: RAPIDAPI_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
